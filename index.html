<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perguntas de Fisioterapia</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    max-width: 60rem;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 2rem;
    align-items: start;
  }

  @media (max-width: 40rem) {
    main { grid-template-columns: 1fr; }
  }

  textarea {
    width: 100%;
    min-height: 9rem;
    padding: 0.6rem;
    font: inherit;
    resize: vertical;
  }

  button {
    margin-top: 0.6rem;
    padding: 0.5rem 1.1rem;
    font: inherit;
    cursor: pointer;
  }

  #status { margin-top: 0.6rem; font-size: 0.9rem; }

  #lista {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  details summary {
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.9rem;
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }

  details summary span::before { content: "[+] "; }

  details[open] summary span::before { content: "[-] "; }

  details time {
    color: #666;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  details p {
    margin: 0.4rem 0 0;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }

  dialog input {
    width: 100%;
    padding: 0.5rem;
    font: inherit;
  }

  #erro-senha {
    color: #b00020;
    font-size: 0.85rem;
    min-height: 1.1em;
  }
</style>
</head>
<body>
  <main>
    <section>
      <form id="form">
        <textarea id="pergunta" placeholder="Digite o enunciado da pergunta..." required></textarea>
        <br>
        <button type="submit">Enviar</button>
        <p id="status"></p>
      </form>
    </section>

    <section>
      <div id="lista"></div>
    </section>
  </main>

  <dialog id="senha-dialog">
    <form id="senha-form">
      <p>Senha:</p>
      <input id="senha-input" type="password" autocomplete="off" required>
      <p id="erro-senha"></p>
      <button type="button" id="senha-cancelar">Cancelar</button>
      <button type="submit" id="senha-confirmar">Confirmar</button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
