<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Pergunta</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 40rem;
    margin: 4rem auto;
    padding: 0 1rem;
    color: #111;
  }
  h1 { font-size: 1.2rem; margin-bottom: 1.5rem; }
  textarea {
    width: 100%;
    min-height: 8rem;
    padding: 0.6rem;
    font: inherit;
    resize: vertical;
  }
  input {
    width: 100%;
    padding: 0.6rem;
    font: inherit;
    margin-top: 0.6rem;
  }
  button {
    margin-top: 0.8rem;
    padding: 0.5rem 1.2rem;
    font: inherit;
    cursor: pointer;
  }
  #status { margin-top: 0.8rem; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Enviar pergunta de fisioterapia</h1>
  <form id="form">
    <textarea id="pergunta" placeholder="Digite o enunciado da pergunta..." required></textarea>
    <input id="senha" type="password" placeholder="Senha" required>
    <br>
    <button type="submit">Enviar</button>
    <p id="status"></p>
  </form>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
